services:
  backup:
    image: ${BACKUP_IMAGE:-registry.cn-hangzhou.aliyuncs.com/sxxpqp/file-s3-backup:latest}
    pull_policy: always
    env_file:
      - .env
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - type: bind
        source: /www/wwwroot
        target: /source
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /tmp:size=128m
