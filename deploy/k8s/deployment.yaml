apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-s3-backup
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: file-s3-backup
  template:
    metadata:
      labels:
        app: file-s3-backup
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          image: registry.cn-hangzhou.aliyuncs.com/sxxpqp/file-s3-backup:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: file-s3-backup-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: source
              mountPath: /source
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: source
          persistentVolumeClaim:
            claimName: sohu-shop-web-base
            readOnly: true
